name: contribution snake

# Draws this year's contribution grid as a snake eating the squares, and
# pushes the two SVGs (light and dark) to the `output` branch, which the README
# points at. Nothing else in the repository is touched.
#
# It runs twice a day because the grid changes as commits land, and on demand
# from the Actions tab. If the snake ever stops being wanted, delete this file
# and the "Contribution snake" section of the README -- nothing else depends
# on it.

on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      # only to push the generated SVGs to the output branch
      contents: write
    steps:
      - name: Generate the snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
